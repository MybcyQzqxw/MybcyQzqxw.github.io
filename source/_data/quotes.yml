# 首页封面的个性签名，每次打开或刷新首页时随机展示一条
# text: 签名正文（大字，居中）；from: 出处（小字，居右，前面自动加“——”，可省略）
# 需要分行显示时，text 后写 |，下一行起每行缩进后各写一行即可（见第二条）
# 新增签名时按下面的格式追加即可

- text: 明月不曾言 情在七弦外
  from: 《明月顾我》

- text: |
    枕些无主杨花 趁着倦意睡下
    千里外应有 天星清辉满洒
  from: 《千秋此意》

- text: 岁月静好 才闲来蹉跎
  from: 《小柳儿》

- text: 琴起素纱五弦拨 月照离人两相陌
  from: 《入骨》

- text: 临窗听雨夜 笔忆话梦谈
  from: 《吹灭小山河》

- text: 一梦枕白鹤 轻舟过万江
  from: 《仲夏酿》

- text: 向江南折过花 对春风与红蜡
  from: 《不谓侠》

- text: 是青山问路否 欲过我第一重
  from: 《青山第一重》

- text: |
    三千鬓发愁 五十弦外清风楼
    一夜未眠君知否
  from: 《一夜未眠君知否》

# - text: 九州重明衔风到 华夏絜钩抱雪消
#   from: 《新春小记》

- text: |
    罗绮织韶华 剑器涵光何日遣
    百工摩其心魂方教玲珑添
  from: 《西施江南》

- text: |
    烟月醉在胸口 薄纸困顿句首
    且与江山共白头 遍始休
  from: 《清风羡我》

- text: |
    休去说闲与愁
    何不若与我 共语濛烟外
  from: 《泼墨漓江》

- text: 染汀上白沙 一醉到月下
  from: 《春风化雨》

- text: 细雨何需伞 来遮缱绻意
  from: 《云水倾虹》

- text: |
    忽闻笑语轻曳 娓娓道声久别
    而岁月 不经意无邪
  from: 《晴川雪》

- text: |
    当柳梢下的集句 尽数流过眼底
    拈一缕春风浅浅作序
    待到行间字里 再不是眼前朝夕
    曲中人早已离题
  from: 《杏花弦外雨》

- text: |
    是谁说的岁月漫长
    容得你我深入浅尝
  from: 《一指韶华》

- text: |
    所思皆入梦 所爱不相逢
    桃花若解梦 何事不情钟
  from: 《桃花解梦》

- text: |
    年少自温柔 不忍年华皱
    又梦杨花庭前落一宿
    剪水一双瞳 裁去一段秋
    竹笛半吹醉不问缘由
  from: 《清风方是闲》

- text: |
    长风吹乱书页 万古人间世事清瘦
    多少人提灯观月 任它下西楼
  from: 《古旧人间》

- text: |
    彼时有月色 洒落穿花拂岸
    钟声漫时秉烛夜话寒山
  from: 《春衫年少》

- text: |
    今宵灯火阑珊轻舟重归故里
    是我提笔浓墨转细
    岁月的斑驳被描摹极其细腻
    在梦里梦外都是你
  from: 《明月故里》

- text: |
    细雨敲檐淅沥沥 乱红落伞影依稀
    未知此情何处起 恍若此间黏地絮
  from: 《桃之夭杳》

- text: 谁知来者无穷 谁记去者无形
  from: 《忽如远行客》

- text: |
    不恋秦楚楼 素栖山寺遗世独幽
    偏香客多情眸 无端惹却一身愁
  from: 《十二和春令》

- text: |
    把酒临风 琴声起 烟波里绘入丹青
    换寥寥数言小令 朱砂为凭
    我赋山海清 你画盛世行
    执箸同奏一笑醉酩酊
  from: 《画诗》

- text: |
    趿鞋急走又故作轻
    怕沾泥提裙又恼忘理鬓
    欲说好个天晴
    出口却成一句
    举世颜色皆不如君
  from: 《娱琴小记》

- text: 词当不拘庸格 笔自不落俗意
  from: 《化外风流》

- text: |
    卧听江城一夜雪
    且吟酌 思华年
    细搅墨香入筠笼
    空樽前 绕绿烟
  from: 《瓷意千年》

- text: |
    忽闻得谁家墙内 有琴声泠然
    聆仙乐不忍疾行 问轿可暂缓
    渐入境如梦似幻
    竟久伫忘归 任霓浅霞残
    三两弦轻轻慢慢 心下正陶然
    恨不能 一纸宫商 谱尽江南
    曲方歇意未完 犹自劝
    佳酿醉人 莫要再贪
  from: 《泠然》

- text: |
    天公应自 何处借得丹青妙笔
    绘我生平 兀自多灵犀
  from: 《如怀尺璧》

- text: |
    天山千里雪 伸手拦一拦
    花雕敬一盏 请为我开颜
  from: 《不问天》

- text: |
    天高海阔盛世飞扬
    再谱十万章
  from: 《万古生香》

- text: |
    仗剑行山水 诗一盏 酒一杯
    折草而吹 摘落星月作剑佩
    清风莫追 我鞍下的马尾
    天涯一骑不回 驰万里 惊尘灰
  from: 《白驹》

- text: 枕一夜风雨 梦里都随他
  from: 《消夏》

- text: 雪霁天清寒 月色自皎洁
  from: 《月见》

- text: 清风明月何须问 流水行云任所之
  from: 《有莲》

- text: |
    知人间万世不竭 风光与皓月
    无意动人 无意传奇诗篇
    山门外风波江湖 太深太浅
    不如同谁 共上纵云阶
  from: 《千岁暖》

- text: |
    回首时人间沧海
    揽梁间行云 帘幕外听蝉
  from: 《念平生》

- text: 醒时何似旧时归 将期何堪故期会
  from: 《乘云归》

- text: 欲说留白间辗转 怎能抵乍见之欢
  from: 《赴此春约》

- text: |
    纵是离散寻常心之所向在远未远方
    好梦不散场所愿得偿双双
  from: 《向阳叙事》

- text: |
    风急雨骤 残红迹沾染广袖
    说人世如棋 输与轮回一先手
    飘零而久 姓名何人深究
    衣冠冢外 岁月稽首
  from: 《薄酒寄西风》

- text: |
    十里长街走马 隔花见秋千
    九重回廊擦肩 又寻而不见
    八声甘州浅唱 宜珠玉山野
    意动提笔赋长句七言
  from: 《缘生意转》

- text: |
    江湖不过此山间 惟愿樽前
    月照绮窗 灯火如旧年
  from: 《明月曾照百川流》

- text: |
    不切实际的 写在纸上
    无法实现的 绘成梦吧
  from: 《我的故事未写完》

- text: |
    年少枕山海 遥祝梨花白
    如今篱笆墙矮 闲阶就月看 谁笑意清婉
    你掬水弄月 或折山茶晚 春也输一半
    于这巷陌寻常 写相思款款 人间则清欢
  from: 《归时春未晚》

- text: |
    人间入味清风调
    闲来不论秋日尚早
    千岁暖过几色春晓
    溪云初起风华茂
  from: 《飞花调》

- text: |
    韶光呀 去悠悠
    可否为我少淹留
    日东升 月西走
    逝者如斯不回头
  from: 《不唱愁》

- text: |
    归鸟飞过了浮云远山外 檐下筑新宅
    对影缠绵 衔来风月几载
    萤火落裙摆 青丝挽上玉钗
    星子落天外 遥遥似是故人来
    相思盈满怀
  from: 《夏至故人来》

- text: |
    若随你 海角天涯
    去那水云深处看凫雁飒沓
    去到披星戴月的春秋冬夏
    归来着一袭风雪算不算潇洒
  from: 《翩翩》

- text: |
    那是我许多不眠夜燃的灯
    鼎沸岁月这无量酒瓮
    私藏的不朽
    其实还盛着许多 所爱所忧
    都怀念良久
  from: 《你是我年少求剑时刻的舟》

- text: |
    四方江水皆通九州
    九曲朝天 未必不回头
  from: 《九曲》

- text: |
    我偏要 爱你隐忍挣扎的落魄
    纵使光华殆没 溺于附骨般焦灼
    我偏要 用尽笔力停驻在哪句末
    排章布局成全本该有的完满几多
  from: 《人间温柔色》

- text: |
    那年烟雨霏霏 我烹茶将爱煮沸
    青瓷茶杯盛不下情意丰沛
  from: 《烟雨茶》

- text: |
    你是动人诗篇
    亦是我最灼烫心愿
    千般迂回的字眼 编作信笺
    钟情之言 不分深浅
  from: 《冬日来信》

- text: |
    山海隔着往事 人海隔着长堤
    百转千折越是在意 越容易变成插曲
  from: 《回声记》

- text: 隔山隔海回头望 最远最近是家乡
  from: 《天知河》

- text: 美景偏宜短 花好不胜昙
  from: 《人间未满》

- text: |
    莫道江南春色好 雨潸潸 又发新柳
    凭栏望明月晦朔复一秋
    醉时长梦花枝底 且抛掷 昨日愁
    觑眼底星辰轮转如旧
  from: 《浮水随春去》

- text: |
    飞过碧海青天和迢递岁月
    只为拨开聚散无常的云烟
    东风相邀秋千
    花下你多情眉眼
    不朽在临安旧年春的画卷
  from: 《纸鸢与少年》

- text: |
    纵此生不得潇洒 也总有过一夏
    今夏旧友俱在 闲坐山崖 天风拂我发
    唇齿间三千歌 唱来与君解忧乏
    古来多少事 落于手札俱为横竖撇捺
  from: 《流云辞·司夏》

- text: |
    君臣一梦 今古空名
    但远山长 云山乱 晓山青
  from: 苏轼《行香子》

- text: 但将痛饮酬风月 莫放离歌入管弦
  from: 辛弃疾《鹧鸪天》

- text: |
    壮年听雨客舟中
    江阔云低 断雁叫西风
  from: 蒋捷《虞美人》

- text: |
    韶华休笑本无根
    好风频借力 送我上青云
  from: 曹雪芹《临江仙》

- text: 曾批给雨支风券 累上留云借月章
  from: 朱敦儒《鹧鸪天》

- text: |
    九万里风鹏正举
    风休住 蓬舟吹取三山去
  from: 李清照《渔家傲》

- text: |
    何须论得丧
    才子词人 自是白衣卿相
  from: 柳永《鹤冲天》

- text: |
    山月不知心里事 水风空落眼前花
    摇曳碧云斜
  from: 温庭筠《梦江南》