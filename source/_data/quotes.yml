# 首页封面的个性签名，每次打开或刷新首页时随机展示一条
# text: 签名正文（大字，居中）；from: 出处（小字，居右，前面自动加“——”，可省略）
# 需要分行显示时，text 后写 |，下一行起每行缩进后各写一行即可（见第二条）
# 新增签名时按下面的格式追加即可

- text: 明月不曾言 情在七弦外
  from: 《明月顾我》

- text: |
    枕些无主杨花 趁着倦意睡下
    千里外应有 天星清辉满洒
  from: 《千秋此意》

- text: 岁月静好 才闲来蹉跎
  from: 《小柳儿》

- text: 琴起素纱五弦拨 月照离人两相陌
  from: 《入骨》

- text: 临窗听雨夜 笔忆话梦谈
  from: 《吹灭小山河》

- text: 一梦枕白鹤 轻舟过万江
  from: 《仲夏酿》

- text: 向江南折过花 对春风与红蜡
  from: 《不谓侠》

- text: 是青山问路否 欲过我第一重
  from: 《青山第一重》

- text: |
    三千鬓发愁 五十弦外清风楼
    一夜未眠君知否
  from: 《一夜未眠君知否》

# - text: 九州重明衔风到 华夏絜钩抱雪消
#   from: 《新春小记》

- text: |
    罗绮织韶华 剑器涵光何日遣
    百工摩其心魂方教玲珑添
  from: 《西施江南》

- text: |
    烟月醉在胸口 薄纸困顿句首
    且与江山共白头 遍始休
  from: 《清风羡我》

- text: |
    休去说闲与愁
    何不若与我 共语濛烟外
  from: 《泼墨漓江》

- text: 染汀上白沙 一醉到月下
  from: 《春风化雨》

- text: 细雨何需伞 来遮缱绻意
  from: 《云水倾虹》

- text: |
    忽闻笑语轻曳 娓娓道声久别
    而岁月 不经意无邪
  from: 《晴川雪》

- text: |
    当柳梢下的集句 尽数流过眼底
    拈一缕春风浅浅作序
    待到行间字里 再不是眼前朝夕
    曲中人早已离题
  from: 《杏花弦外雨》

- text: |
    是谁说的岁月漫长
    容得你我深入浅尝
  from: 《一指韶华》

- text: |
    所思皆入梦 所爱不相逢
    桃花若解梦 何事不情钟
  from: 《桃花解梦》

- text: |
    年少自温柔 不忍年华皱
    又梦杨花庭前落一宿
    剪水一双瞳 裁去一段秋
    竹笛半吹醉不问缘由
  from: 《清风方是闲》

- text: |
    长风吹乱书页 万古人间世事清瘦
    多少人提灯观月 任它下西楼
  from: 《古旧人间》

- text: |
    彼时有月色 洒落穿花拂岸
    钟声漫时秉烛夜话寒山
  from: 《春衫年少》

- text: |
    今宵灯火阑珊轻舟重归故里
    是我提笔浓墨转细
    岁月的斑驳被描摹极其细腻
    在梦里梦外都是你
  from: 《明月故里》

- text: |
    细雨敲檐淅沥沥 乱红落伞影依稀
    未知此情何处起 恍若此间黏地絮
  from: 《桃之夭杳》

- text: 谁知来者无穷 谁记去者无形
  from: 《忽如远行客》

- text: |
    不恋秦楚楼 素栖山寺遗世独幽
    偏香客多情眸 无端惹却一身愁
  from: 《十二和春令》

- text: |
    把酒临风 琴声起 烟波里绘入丹青
    换寥寥数言小令 朱砂为凭
    我赋山海清 你画盛世行
    执箸同奏一笑醉酩酊
  from: 《画诗》

- text: |
    趿鞋急走又故作轻
    怕沾泥提裙又恼忘理鬓
    欲说好个天晴
    出口却成一句
    举世颜色皆不如君
  from: 《娱琴小记》

- text: 词当不拘庸格 笔自不落俗意
  from: 《化外风流》

- text: |
    卧听江城一夜雪
    且吟酌 思华年
    细搅墨香入筠笼
    空樽前 绕绿烟
  from: 《瓷意千年》

- text: |
    忽闻得谁家墙内 有琴声泠然
    聆仙乐不忍疾行 问轿可暂缓
    渐入境如梦似幻
    竟久伫忘归 任霓浅霞残
    三两弦轻轻慢慢 心下正陶然
    恨不能 一纸宫商 谱尽江南
    曲方歇意未完 犹自劝
    佳酿醉人 莫要再贪
  from: 《泠然》

- text: |
    天公应自 何处借得丹青妙笔
    绘我生平 兀自多灵犀
  from: 《如怀尺璧》

- text: |
    天山千里雪 伸手拦一拦
    花雕敬一盏 请为我开颜
  from: 《不问天》

- text: |
    天高海阔盛世飞扬
    再谱十万章
  from: 《万古生香》

- text: |
    仗剑行山水 诗一盏 酒一杯
    折草而吹 摘落星月作剑珮
    清风莫追 我鞍下的马尾
    天涯一骑不回 驰万里 惊尘灰
  from: 《白驹》

- text: 枕一夜风雨 梦里都随他
  from: 《消夏》

- text: |
    君臣一梦 今古空名
    但远山长 云山乱 晓山青
  from: 苏轼《行香子》

- text: 但将痛饮酬风月 莫放离歌入管弦
  from: 辛弃疾《鹧鸪天》

- text: |
    壮年听雨客舟中
    江阔云低 断雁叫西风
  from: 蒋捷《虞美人》

- text: |
    韶华休笑本无根
    好风频借力 送我上青云
  from: 曹雪芹《临江仙》

- text: 曾批给雨支风券 累上留云借月章
  from: 朱敦儒《鹧鸪天》

- text: |
    九万里风鹏正举
    风休住 蓬舟吹取三山去
  from: 李清照《渔家傲》

- text: |
    何须论得丧
    才子词人 自是白衣卿相
  from: 柳永《鹤冲天》

- text: |
    山月不知心里事 水风空落眼前花
    摇曳碧云斜
  from: 温庭筠《梦江南》