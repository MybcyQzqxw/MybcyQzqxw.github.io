# 首页封面的个性签名，每次打开或刷新首页时随机展示一条
# text: 签名正文（大字，居中）；from: 出处（小字，居右，前面自动加“——”，可省略）
# 需要分行显示时，text 后写 |，下一行起每行缩进后各写一行即可（见第二条）
# 新增签名时按下面的格式追加即可

- text: 明月不曾言，情在七弦外。
  from: 《明月顾我》

- text: |
    枕些无主杨花，趁着倦意睡下。
    千里外应有，天星清辉满洒。
  from: 《千秋此意》

- text: 岁月静好，才闲来蹉跎。
  from: 《小柳儿》

- text: 琴起素纱五弦拨，月照离人两相陌。
  from: 《入骨》

- text: 临窗听雨夜，笔忆话梦谈。
  from: 《吹灭小山河》

- text: 一梦枕白鹤，轻舟过万江。
  from: 《仲夏酿》

- text: 向江南折过花，对春风与红蜡。
  from: 《不谓侠》

- text: 是青山问路否？欲过我第一重。
  from: 《青山第一重》

- text: |
    三千鬓发愁，五十弦外清风楼。
    一夜未眠君知否？
  from: 《一夜未眠君知否》

# - text: 九州重明衔风到，华夏絜钩抱雪消。
#   from: 《新春小记》

- text: |
    罗绮织韶华，剑器涵光何日遣。
    百工摩其心魂方教玲珑添。
  from: 《西施江南》

- text: |
    烟月醉在胸口，薄纸困顿句首。
    且与江山共白头，遍始休。
  from: 《清风羡我》

- text: |
    休去说闲与愁。
    何不若与我，共语濛烟外。
  from: 《泼墨漓江》

- text: 染汀上白沙，一醉到月下。
  from: 《春风化雨》

- text: 细雨何需伞，来遮缱绻意。
  from: 《云水倾虹》

- text: |
    忽闻笑语轻曳，娓娓道声久别。
    而岁月，不经意无邪。
  from: 《晴川雪》

- text: |
    君臣一梦，今古空名。
    但远山长，云山乱，晓山青。
  from: 苏轼《行香子》

- text: 但将痛饮酬风月，莫放离歌入管弦。
  from: 辛弃疾《鹧鸪天》

- text: |
    壮年听雨客舟中。
    江阔云低，断雁叫西风。
  from: 蒋捷《虞美人》

- text: |
    韶华休笑本无根。
    好风频借力，送我上青云。
  from: 曹雪芹《临江仙》

- text: 曾批给雨支风券，累上留云借月章。
  from: 朱敦儒《鹧鸪天》

- text: |
    九万里风鹏正举。
    风休住，蓬舟吹取三山去！
  from: 李清照《渔家傲》

- text: |
    何须论得丧？
    才子词人，自是白衣卿相。
  from: 柳永《鹤冲天》
