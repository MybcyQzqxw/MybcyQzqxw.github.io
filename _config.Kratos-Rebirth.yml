# 主题配置文件，覆盖 themes/Kratos-Rebirth/_config.yml 中的默认值
# 完整选项说明请参考 themes/Kratos-Rebirth/_config.yml 里的注释

################## 系统配置 ##################

vendors:
  npm_cdn: ""
  packages:
    nprogress:
      version: "0.2.0"
    qr-code-styling:
      version: "1.6.0-rc.1"
    font-awesome:
      version: "4.7.0"
    viewerjs:
      version: "1.11.6"

check_update: true
pjax: true
viewerjs: true

search:
  provider: "local"
  path:
    page: search
    index_file: search-index.json
  includes:
    - post
    - page
  content: true

################## 样式配置 ##################

image:
  favicon: "/favicon.ico"
  avatar: "/images/avatar.jpg"
  banner: # 首页全屏封面 + 其他页面板块横幅的背景，可填图片路径/URL，也可填纯色（如 #1a1a2e）或渐变色（如 linear-gradient(135deg, #1a1a2e, #16213e)）
    light: ""
    dark: ""
  background:
    light: ""
    dark: ""
  about:
    light: "/images/default.webp"
    dark: "/images/default.webp"

nav:
  auto_hide: true
  items:
    - label: 首页
      icon: home
      url: /
    - label: 归档
      icon: archive
      url: /archives/

index:
  style: "card"

footer:
  links: []
  components:
    uptime:
      since: "2026/09/18 00:00:00"
      text: "本站已运行"
    author:
      homepage: ""
    additional: []

posts:
  default_cover: "/images/default.webp"
  donate: true
  share: true
  word_count:
    enable: true
    threshold: 1500
    estimate_wavy: true
  toc:
    desktop:
      options:
        list_number: false
    mobile:
      enable: true
      options:
        list_number: true

pages:
  donate: true
  share: true

syntax_highlighter:
  theme: night-eighties

sidebar:
  location: right
  widgets:
    - about
    - splitter
    - toc
    - category
    - tagcloud
    - posts

share:
  enable: true
  title: "分享"
  message: "分享这篇文章"
  platforms: []

donate:
  enable: true
  title: "打赏"
  message: "感谢您的支持"
  qrcode_placeholder: ""
  platforms: []

copyright_notice:
  in_page:
    enable_at: []
    template: 本作品采用 <a rel="license nofollow" target="_blank" href="https://creativecommons.org/licenses/by-sa/4.0/">知识共享署名-相同方式共享 4.0 国际许可协议</a> 进行许可
  append_copy:
    enable: true
    threshold: 150
    template: |
      $NEWLINE
      -------------------------
      该内容采用 CC BY-NC-SA 4.0 许可协议，著作权归作者所有。商业转载请联系作者获得授权，非商业转载请注明出处。
      作者：$AUTHOR
      来源：$TITLE
      链接：$LINK

comments:
  core:
    enable_at: []
    template:
      _shared: ""
      index: ""
      post: ""
      page: ""
  count:
    enable_at: []
    template:
      _shared: ""
      index: ""
      post: ""
  path_hasher: "md5"

visit_count:
  enable_at: []
  template:
    _shared: ""
    index: ""
    post: ""
  path_hasher: "md5"

additional_injections:
  head: ""
  footer: ""
  after_footer: ""
  tools: ""
